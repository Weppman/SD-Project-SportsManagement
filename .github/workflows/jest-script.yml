name: Run Jest Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    # Checkout code
    - name: Checkout code
      uses: actions/checkout@v2

    # Set up Node.js
    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '16'  # Specify Node version

    # Install dependencies
    - name: Install dependencies
      run: |
        npm install

    # Run Jest tests
    - name: Run Jest tests
      run: |
        npm test -- --ci --runInBand  # --ci flag is useful for CI environments

    # Optional: Upload test results
    - name: Upload Jest test results
      if: failure()
      uses: actions/upload-artifact@v2
      with:
        name: jest-test-results
        path: ./test-results
