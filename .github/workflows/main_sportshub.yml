name: Build and deploy Node.js 22 app to Azure Web App - SportsHub

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: 'SportsHub'
  AZURE_WEBAPP_PACKAGE_PATH: '.'
  NODE_VERSION: '20.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: Production
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: |
        npm ci
        npm install react-dev-utils --save-dev

    - name: Build React app
      run: npm run build

    - name: Run tests
      run: npm run test --if-present

    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
        runtime-stack: 'NODE|22-lts'
        publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
        enable-healthcheck: true
      timeout-minutes: 15

    - name: Verify deployment
      run: |
        curl --retry 5 --retry-delay 10 \
        https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/health